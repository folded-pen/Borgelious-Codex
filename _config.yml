title: The Borgelious Codex
description: >-
  The collected drinking wisdom of the Prophet Borgelious.
  Few are ready. Fewer still remember reading it.

url: "https://hardlygospel.github.io"
baseurl: "/Borgelious-Codex"

remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

color_scheme: dark
search_enabled: true

# Folder-style URLs (/book-3-hour-of-the-wolf/) instead of .html.
permalink: pretty

# The README is for the GitHub repo page only — keep it out of the built site.
exclude:
  - README.md
